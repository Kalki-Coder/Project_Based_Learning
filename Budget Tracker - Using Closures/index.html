<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Closure Budget Lab</title>
  </head>
  <body>
    <h1>Private Budget App</h1>

    <select id="type">
      <option value="inc" selected>+</option>
      <option value="exp">-</option>
    </select>
    <input type="text" id="description" placeholder="Description" />
    <input type="number" id="value" placeholder="Value" />
    <button id="add-btn">Add Item</button>

    <div id="output">Total Budget: 0</div>
    <div class="container">
      <div class="income">
        <h2 class="income__title">Income</h2>
        <div class="income-list"></div>
      </div>
      <div class="expense">
        <h2 class="expense__title">Expense</h2>
        <div class="expense-list"></div>
      </div>
    </div>

    <script src="adv_app.js"></script>
  </body>
</html>
