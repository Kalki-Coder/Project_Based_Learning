<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Links Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <div class="header">
        <div class="pic-container">
          <img src="images/pic.png" alt="Kylie Jenner" class="pic" />
        </div>
        <h1 class="name">Kylie Jenner</h1>
        <p class="location">Los Angeles, United States</p>
        <p class="bio">
          "American socialite and businesswoman building an empire."
        </p>
      </div>

      <ul class="links">
        <li>
          <a href="https://www.instagram.com/kyliejenner/" target="_blank"
            >Instagram</a
          >
        </li>
        <li>
          <a href="https://www.facebook.com/kyliejenner/" target="_blank"
            >Facebook</a
          >
        </li>
        <li>
          <a href="https://www.tiktok.com/@kyliejenner/" target="_blank"
            >TikTok</a
          >
        </li>
        <li>
          <a href="https://www.twitter.com/kyliejenner/" target="_blank"
            >Twitter</a
          >
        </li>
        <li>
          <a href="https://kyliecosmetics.com/" target="_blank"
            >Kylie Cosmetics</a
          >
        </li>
      </ul>
    </main>
  </body>
</html>
