<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Github-Finder App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="search-area">
      <h2 class="heading">Github-Finder</h2>
      <input
        type="text"
        class="search-bar"
        placeholder="Enter the username here"
      />
      <button class="search-btn">Search</button>
    </section>
    <section class="card">
      <img src="" alt="user-image" class="user-image" />
      <h3 class="user-name">user name comes here</h3>
      <p class="user-bio">user bio comes here</p>
      <h4 class="repo_heading">Top 5 Repos of the User</h4>
      <ol class="repos">
      </ol>
    </section>
    <script src="script.js"></script>
  </body>
</html>
